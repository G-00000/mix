<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Simulador de Mistura Populacional</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
label { display: block; margin-top: 10px; }
#controls { margin-bottom: 20px; }
#population { display: flex; flex-wrap: wrap; gap: 10px; }
.individual {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-size: 10px;
  text-align: center;
}
</style>
</head>
<body>
<h1>Simulador de Mistura Populacional</h1>
<div id="controls">
  <label>População inicial: <input type="number" id="popCount" value="10" title="Número de indivíduos endógenos iniciais"></label>
  <label>Cor endógena: <input type="color" id="endogColor" value="#ff0000" title="Cor simbólica para indivíduos endógenos"></label>
  <label>Cor exógena: <input type="color" id="exogColor" value="#0000ff" title="Cor simbólica para indivíduos exógenos"></label>
  <label>Taxa de exogamia (%): <input type="number" id="exogRate" value="20" min="0" max="100" title="Percentagem da população endógena que se cruza com exógenos a cada geração"></label>
  <label>Mínimo para ser endógeno (%): <input type="number" id="minEndog" value="90" min="0" max="100" title="Percentagem mínima de ascendência endógena para considerar o indivíduo como endógeno"></label>
  <label>População exógena: <input type="number" id="exogCount" value="10" title="Número de indivíduos exógenos disponíveis"></label>
  <label>Intervalo de auto geração (s): <input type="number" id="interval" value="3" min="1" title="Tempo entre gerações automáticas"></label>
  <button id="step">Gerar uma geração</button>
  <button id="play">Play</button>
  <button id="stop" disabled>Stop</button>
</div>
<div>Geração: <span id="generation">0</span> &ndash; Anos: <span id="years">0</span></div>
<div id="population"></div>
<script>
let population = [];
let exogenous = [];
let generation = 0;
let timer = null;

function init() {
  const popCount = parseInt(document.getElementById('popCount').value);
  const exogCount = parseInt(document.getElementById('exogCount').value);
  population = [];
  exogenous = [];
  for (let i = 0; i < popCount; i++) {
    population.push({endog: 1});
  }
  for (let i = 0; i < exogCount; i++) {
    exogenous.push({endog: 0});
  }
  generation = 0;
  updateStats();
  drawPopulation();
}

function mixColors(c1, c2, ratio) {
  const r = Math.round(parseInt(c1.substring(1,3),16)*ratio + parseInt(c2.substring(1,3),16)*(1-ratio));
  const g = Math.round(parseInt(c1.substring(3,5),16)*ratio + parseInt(c2.substring(3,5),16)*(1-ratio));
  const b = Math.round(parseInt(c1.substring(5,7),16)*ratio + parseInt(c2.substring(5,7),16)*(1-ratio));
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function makeGeneration() {
  const rate = parseFloat(document.getElementById('exogRate').value)/100;
  const newPop = [];
  for (let i=0; i<population.length; i++) {
    const parent1 = population[Math.floor(Math.random()*population.length)];
    let parent2;
    if (Math.random() < rate) {
      parent2 = exogenous[Math.floor(Math.random()*exogenous.length)];
    } else {
      parent2 = population[Math.floor(Math.random()*population.length)];
    }
    const childEndog = (parent1.endog + parent2.endog)/2;
    newPop.push({endog: childEndog});
  }
  population = newPop;
  generation++;
  updateStats();
  drawPopulation();
}

function drawPopulation() {
  const container = document.getElementById('population');
  container.innerHTML = '';
  const cEndog = document.getElementById('endogColor').value;
  const cExog = document.getElementById('exogColor').value;
  population.forEach(ind => {
    const div = document.createElement('div');
    const endogPct = Math.round(ind.endog*100);
    const exogPct = 100 - endogPct;
    const color = mixColors(cEndog, cExog, ind.endog);
    div.className = 'individual';
    div.style.backgroundColor = color;
    div.title = `Endógeno: ${endogPct}%\nExógeno: ${exogPct}%`;
    div.textContent = endogPct + '%\n' + exogPct + '%';
    container.appendChild(div);
  });
}

function updateStats() {
  document.getElementById('generation').textContent = generation;
  document.getElementById('years').textContent = generation * 25;
}

function play() {
  if (!timer) {
    const interval = parseInt(document.getElementById('interval').value)*1000;
    timer = setInterval(makeGeneration, interval);
    document.getElementById('play').disabled = true;
    document.getElementById('stop').disabled = false;
  }
}

function stop() {
  if (timer) {
    clearInterval(timer);
    timer = null;
    document.getElementById('play').disabled = false;
    document.getElementById('stop').disabled = true;
  }
}

document.getElementById('step').addEventListener('click', makeGeneration);

document.getElementById('play').addEventListener('click', play);
document.getElementById('stop').addEventListener('click', stop);

window.addEventListener('load', init);
</script>
</body>
</html>
